name: notesy cicd pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write   # required for AWS OIDC

# ---------------------------------------------------------------------------
# All environment variables live here, pulled dynamically from GitHub
# secrets/variables. Reference them below as ${{ env.NAME }}.
# ---------------------------------------------------------------------------
env:
  # --- SonarQube Cloud ---
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}                  # secret
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}         # variable
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}       # variable

  # --- AWS / ECR ---
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}    # secret (full role ARN)
  AWS_REGION: ${{ vars.AWS_REGION }}                       # variable
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}               # variable

  # --- Docker image ---
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}                       # variable
  IMAGE_TAG_LOCAL: ${{ vars.IMAGE_TAG_LOCAL }}             # variable

  # --- Runtime versions ---
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}               # variable
  NODE_VERSION: ${{ vars.NODE_VERSION }}                   # variable

  # --- Test database ---
  POSTGRES_DB: ${{ vars.POSTGRES_DB }}                     # variable
  POSTGRES_USER: ${{ vars.POSTGRES_USER }}                 # variable
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}      # secret

  # --- Django test settings ---
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}             # secret
  DEBUG: ${{ vars.DEBUG }}                                 # variable

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-sonar:
    name: Run Tests & SonarCloud Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # job-level env can't read the env context, so build this from vars/secrets
      DATABASE_URL: postgres://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ vars.POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies & build assets
        run: |
          npm install
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run database migrations
        run: python manage.py migrate

      - name: Run pytest with coverage
        run: pytest --cov=. --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        # SONAR_TOKEN comes from the workflow-level env above
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/node_modules/**,**/staticfiles/**,**/static/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/*_test.py,**/tests.py
            -Dsonar.python.coverage.reportPaths=coverage.xml

  docker-trivy-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-sonar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_LOCAL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        # TODO: pin to a release tag or commit SHA instead of @master
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_LOCAL }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  build-and-push-ecr:
    name: Build & Push to Amazon ECR
    needs: docker-trivy-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      
      - name: Render Amazon ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ vars.ECS_TASK_DEFINITION }}
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true